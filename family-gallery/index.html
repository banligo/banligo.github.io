---
layout: none
---
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Family Color Gallery</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap");

      :root {
        --bg-0: #080b10;
        --bg-1: #111824;
        --card: rgba(16, 22, 34, 0.82);
        --line: rgba(255, 255, 255, 0.15);
        --text: #eef4ff;
        --sub: #b8c1d0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        color: var(--text);
        font-family: "Noto Sans SC", sans-serif;
        background:
          radial-gradient(900px 420px at -5% 0%, rgba(255, 119, 119, 0.2), rgba(255, 119, 119, 0) 60%),
          radial-gradient(980px 460px at 110% 100%, rgba(106, 162, 255, 0.23), rgba(106, 162, 255, 0) 56%),
          linear-gradient(155deg, var(--bg-0), var(--bg-1));
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 3px 3px;
        mix-blend-mode: soft-light;
      }

      .app {
        width: min(1120px, 95vw);
        height: 100vh;
        margin: 0 auto;
        padding: 14px 0 16px;
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 10px;
      }

      .head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .title {
        margin: 0;
        font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
        font-size: clamp(1.15rem, 2.2vw, 1.8rem);
        letter-spacing: 0.02em;
      }

      .sub {
        margin: 5px 0 0;
        font-size: 0.82rem;
        color: var(--sub);
      }

      .home-link {
        text-decoration: none;
        color: #fff;
        border-radius: 999px;
        padding: 8px 13px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.08);
        font-size: 0.82rem;
        white-space: nowrap;
      }

      .palette {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        background: rgba(15, 21, 31, 0.52);
        backdrop-filter: blur(8px);
        padding: 10px 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: nowrap;
        gap: clamp(6px, 1.5vw, 10px);
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }

      .palette::-webkit-scrollbar {
        display: none;
      }

      .color-btn {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        color: #fff;
        font-size: clamp(0.74rem, 2.4vw, 0.86rem);
        font-weight: 700;
        width: clamp(34px, 6.6vw, 46px);
        height: clamp(34px, 6.6vw, 46px);
        min-width: clamp(34px, 6.6vw, 46px);
        padding: 0;
        display: grid;
        place-items: center;
        line-height: 1;
        cursor: pointer;
        background: #2a3445;
        transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      }

      .color-btn:hover {
        transform: translateY(-1px);
      }

      .color-btn.active {
        border-color: rgba(255, 255, 255, 0.92);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.44) inset;
      }

      .color-btn.red { background: linear-gradient(135deg, #ff4f5a, #d12843); }
      .color-btn.orange { background: linear-gradient(135deg, #ff9a3d, #dc6b11); }
      .color-btn.yellow { background: linear-gradient(135deg, #ffd851, #d89f1d); color: #2a1a00; font-weight: 700; }
      .color-btn.green { background: linear-gradient(135deg, #65d66f, #2e8f47); }
      .color-btn.cyan { background: linear-gradient(135deg, #56d5df, #149db1); }
      .color-btn.blue { background: linear-gradient(135deg, #65a4ff, #2f64d9); }
      .color-btn.purple { background: linear-gradient(135deg, #c580ff, #8b49d8); }
      .color-btn.white {
        background: linear-gradient(135deg, #ffffff, #d9dee8);
        color: #1f2a3d;
        border-color: rgba(18, 26, 42, 0.25);
      }
      .color-btn.black {
        background: linear-gradient(135deg, #2d3442, #05070a);
        color: #f4f7ff;
      }

      .stage {
        border: 0;
        border-radius: 0;
        background: transparent;
        backdrop-filter: none;
        padding: 0;
        min-height: 0;
      }

      .cards {
        position: relative;
        min-height: 0;
        height: 100%;
        overflow: hidden;
        border-radius: 16px;
      }

      .card {
        position: absolute;
        border-radius: 14px;
        overflow: hidden;
        border: 0;
        background: transparent;
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.25);
        transform: rotate(var(--rot, 0deg)) scale(var(--zoom, 1));
        transition: transform 180ms ease, box-shadow 180ms ease;
        cursor: pointer;
      }

      .card img {
        width: 100%;
        height: auto;
        object-fit: initial;
        display: block;
        background: transparent;
      }

      .card.front {
        box-shadow: 0 20px 44px rgba(0, 0, 0, 0.35);
      }

      .empty {
        border-radius: 14px;
        border: 1px dashed rgba(255, 255, 255, 0.2);
        display: grid;
        place-items: center;
        color: var(--sub);
        font-size: 0.88rem;
        text-align: center;
        padding: 10px;
      }

    </style>
  </head>
  <body>
    <main class="app">
      <header class="head">
        <div>
          <h1 class="title">照片颜色选择器（AI生成代码）</h1>
          <p class="sub">温馨提示：前几次选择的时候分析照片需要时间，请耐心等待。</p>
        </div>
        <!-- <a class="home-link" href="{{ '/' | relative_url }}">返回 Home</a> -->
      </header>

      <section id="palette" class="palette"></section>

      <section class="stage">
        <div id="cards" class="cards">
          <div class="empty">等待颜色选择</div>
        </div>
      </section>
    </main>

    {% assign gallery_files = site.static_files | where_exp: "f", "f.path contains '/family-gallery/content/photos/'" | sort: "path" %}
    <script>
      const PHOTO_POOL = [
        {% for f in gallery_files %}
          {% assign ext = f.extname | downcase %}
          {% if ext == ".jpg" or ext == ".jpeg" or ext == ".png" or ext == ".webp" %}
            "{{ f.path | replace_first: '/family-gallery/', '' }}",
          {% endif %}
        {% endfor %}
      ];
      const PHOTO_SET = new Set(PHOTO_POOL);
      const SCORE_CACHE_KEY = "family_gallery_scores_v3";
      const SCORE_CACHE_VERSION = 3;
      const SCORE_CACHE_MAX = 1600;
      const SCAN_CONCURRENCY = 2;
      const SCAN_BATCH_PAUSE_MS = 40;
      const SCAN_IDLE_PAUSE_MS = 170;
      const TARGET_QUALIFIED_PER_COLOR = 34;

      const COLORS = [
        { id: "red", label: "红", className: "red", hue: 0, mode: "hue" },
        { id: "orange", label: "橙", className: "orange", hue: 28, mode: "hue" },
        { id: "yellow", label: "黄", className: "yellow", hue: 52, mode: "hue" },
        { id: "green", label: "绿", className: "green", hue: 118, mode: "hue" },
        { id: "cyan", label: "青", className: "cyan", hue: 182, mode: "hue" },
        { id: "blue", label: "蓝", className: "blue", hue: 222, mode: "hue" },
        { id: "purple", label: "紫", className: "purple", hue: 286, mode: "hue" },
        { id: "white", label: "白", className: "white", mode: "neutral" },
        { id: "black", label: "黑", className: "black", mode: "neutral" },
      ];
      const HUE_COLORS = COLORS.filter((c) => c.mode === "hue");

      const paletteEl = document.getElementById("palette");
      const cardsEl = document.getElementById("cards");

      const analysisCache = new Map();
      let currentColor = null;
      let busy = false;
      let topZ = 40;
      let userPickCount = 0;
      const scoreCache = new Map();
      const qualifiedCounts = Object.fromEntries(COLORS.map((c) => [c.id, 0]));
      let scanOrder = [];
      let scanIndex = 0;
      let scanRunning = false;
      let analyzedCount = 0;
      let saveCacheTimer = null;

      const analyzerCanvas = document.createElement("canvas");
      analyzerCanvas.width = 48;
      analyzerCanvas.height = 48;
      const analyzerCtx = analyzerCanvas.getContext("2d", { willReadFrequently: true });

      function randInt(min, max) {
        return min + Math.floor(Math.random() * (max - min + 1));
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function getStorage() {
        try {
          return window.localStorage;
        } catch (_) {
          return null;
        }
      }

      function clearQualifiedCounts() {
        for (const c of COLORS) qualifiedCounts[c.id] = 0;
      }

      function accumulateQualifiedCounts(scores) {
        for (const c of COLORS) {
          if (evaluateColorFit(scores, c.id).qualifies) qualifiedCounts[c.id] += 1;
        }
      }

      function rebuildQualifiedCounts() {
        clearQualifiedCounts();
        for (const scores of scoreCache.values()) {
          accumulateQualifiedCounts(scores);
        }
      }

      function loadScoreCache() {
        const storage = getStorage();
        if (!storage) return;
        try {
          const raw = storage.getItem(SCORE_CACHE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (!parsed || parsed.v !== SCORE_CACHE_VERSION || !Array.isArray(parsed.items)) return;

          for (const item of parsed.items) {
            if (!Array.isArray(item) || item.length !== 2) continue;
            const path = item[0];
            const arr = item[1];
            if (typeof path !== "string" || !PHOTO_SET.has(path) || !Array.isArray(arr)) continue;

            const scores = {};
            for (let i = 0; i < COLORS.length; i += 1) {
              const id = COLORS[i].id;
              const value = Number(arr[i] || 0);
              scores[id] = Number.isFinite(value) ? value : 0;
            }
            scoreCache.set(path, scores);
            analysisCache.set(path, scores);
          }
          rebuildQualifiedCounts();
          analyzedCount = scoreCache.size;
        } catch (_) {
          // ignore malformed cache
        }
      }

      function saveScoreCacheNow() {
        const storage = getStorage();
        if (!storage) return;
        try {
          const items = [];
          let kept = 0;
          for (const [path, scores] of scoreCache) {
            if (!PHOTO_SET.has(path)) continue;
            items.push([path, COLORS.map((c) => Number((scores[c.id] || 0).toFixed(4)))]);
            kept += 1;
            if (kept >= SCORE_CACHE_MAX) break;
          }
          storage.setItem(SCORE_CACHE_KEY, JSON.stringify({ v: SCORE_CACHE_VERSION, items }));
        } catch (_) {
          // ignore quota/storage errors
        }
      }

      function queueSaveScoreCache() {
        if (saveCacheTimer !== null) return;
        saveCacheTimer = setTimeout(() => {
          saveCacheTimer = null;
          saveScoreCacheNow();
        }, 1200);
      }

      function hasEnoughCoverage() {
        return COLORS.every((c) => qualifiedCounts[c.id] >= TARGET_QUALIFIED_PER_COLOR);
      }

      function fileLabel(path) {
        const file = path.split("/").pop() || "";
        return decodeURIComponent(file).replace(/\.[^.]+$/, "");
      }

      function hueDistance(a, b) {
        const d = Math.abs(a - b) % 360;
        return Math.min(d, 360 - d);
      }

      function hueDistanceForColor(h, colorId, hue) {
        if (colorId !== "purple") return hueDistance(h, hue);
        // Purple uses multiple anchors to cover violet + magenta-leaning purple.
        const anchors = [272, 292, 312];
        let best = Infinity;
        for (const a of anchors) {
          const d = hueDistance(h, a);
          if (d < best) best = d;
        }
        return best;
      }

      function rgbToHsv(r, g, b) {
        const rn = r / 255;
        const gn = g / 255;
        const bn = b / 255;
        const max = Math.max(rn, gn, bn);
        const min = Math.min(rn, gn, bn);
        const d = max - min;

        let h = 0;
        if (d !== 0) {
          if (max === rn) h = ((gn - bn) / d) % 6;
          else if (max === gn) h = (bn - rn) / d + 2;
          else h = (rn - gn) / d + 4;
          h = Math.round(h * 60);
          if (h < 0) h += 360;
        }

        const s = max === 0 ? 0 : d / max;
        const v = max;
        return { h, s, v };
      }

      function clamp(v, min, max) {
        return Math.min(max, Math.max(min, v));
      }

      function loadImage(path) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.decoding = "async";
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = path;
        });
      }

      async function analyzePhoto(path) {
        if (analysisCache.has(path)) return analysisCache.get(path);

        const scores = Object.fromEntries(COLORS.map((c) => [c.id, 0]));
        const hits = Object.fromEntries(COLORS.map((c) => [c.id, 0]));
        try {
          const img = await loadImage(path);
          analyzerCtx.clearRect(0, 0, analyzerCanvas.width, analyzerCanvas.height);
          analyzerCtx.drawImage(img, 0, 0, analyzerCanvas.width, analyzerCanvas.height);
          const data = analyzerCtx.getImageData(0, 0, analyzerCanvas.width, analyzerCanvas.height).data;

          let useful = 0;
          for (let i = 0; i < data.length; i += 20) {
            const a = data[i + 3];
            if (a < 40) continue;

            const { h, s, v } = rgbToHsv(data[i], data[i + 1], data[i + 2]);
            if (v < 0.02) continue;

            useful += 1;
            if (v <= 0.2 && s <= 0.42) {
              hits.black += 1;
              continue;
            }
            if (v >= 0.82 && s <= 0.2) {
              hits.white += 1;
              continue;
            }
            if (s < 0.075 || v < 0.08) continue;

            let bestId = null;
            let bestD = Infinity;
            for (const c of HUE_COLORS) {
              const d = hueDistanceForColor(h, c.id, c.hue);
              if (d < bestD) {
                bestD = d;
                bestId = c.id;
              }
            }
            const bestSpan = bestId === "purple" ? 60 : 50;
            if (bestId && bestD <= bestSpan) {
              hits[bestId] += 1;
            }
          }

          if (useful > 0) {
            for (const c of COLORS) scores[c.id] = hits[c.id] / useful;
          }
        } catch (_) {
          // keep zero scores
        }

        analysisCache.set(path, scores);
        return scores;
      }

      function evaluateColorFit(scores, colorId) {
        const target = scores[colorId] || 0;
        const isNeutral = colorId === "white" || colorId === "black";
        const isPurple = colorId === "purple";
        let maxOther = 0;
        let sumOther = 0;
        for (const c of COLORS) {
          if (c.id === colorId) continue;
          const v = scores[c.id] || 0;
          sumOther += v;
          if (v > maxOther) maxOther = v;
        }

        const dominance = target / Math.max(maxOther, 0.0001);
        const relative = target / Math.max(target + sumOther, 0.0001);

        const minPresence = isNeutral ? 0.06 : (isPurple ? 0.04 : 0.05);
        const strongPresence = isNeutral ? 0.14 : (isPurple ? 0.095 : 0.12);
        const minDominance = isNeutral ? 0.86 : (isPurple ? 0.66 : 0.78);
        const minRelative = isNeutral ? 0.32 : (isPurple ? 0.22 : 0.28);
        const qualifies =
          target >= minPresence &&
          (dominance >= minDominance ||
            target >= strongPresence ||
            relative >= minRelative);

        const strength = target * 1.3 + Math.min(1.6, dominance) * 0.18 + relative * 0.42;
        return { target, dominance, relative, qualifies, strength };
      }

      function weightedPick(items, count) {
        const pool = items.slice();
        const picked = [];
        while (pool.length && picked.length < count) {
          const total = pool.reduce((sum, it) => sum + (it.score + 0.01), 0);
          let r = Math.random() * total;
          let idx = 0;
          for (; idx < pool.length; idx += 1) {
            r -= pool[idx].score + 0.01;
            if (r <= 0) break;
          }
          picked.push(pool[Math.min(idx, pool.length - 1)]);
          pool.splice(Math.min(idx, pool.length - 1), 1);
        }
        return picked;
      }

      async function analyzeAndStore(path) {
        if (scoreCache.has(path)) return;
        const scores = await analyzePhoto(path);
        scoreCache.set(path, scores);
        accumulateQualifiedCounts(scores);
        analyzedCount = scoreCache.size;
        queueSaveScoreCache();
      }

      function ensureBackgroundScan() {
        if (!PHOTO_POOL.length) return;
        if (!scanOrder.length) {
          scanOrder = shuffle(PHOTO_POOL);
          scanIndex = 0;
          analyzedCount = scoreCache.size;
        }
        if (scanRunning || scanIndex >= scanOrder.length) return;

        scanRunning = true;
        void (async () => {
          while (scanIndex < scanOrder.length) {
            if (document.hidden) {
              await sleep(450);
              continue;
            }

            const batch = [];
            while (batch.length < SCAN_CONCURRENCY && scanIndex < scanOrder.length) {
              const path = scanOrder[scanIndex];
              scanIndex += 1;
              if (!scoreCache.has(path)) batch.push(path);
            }

            if (!batch.length) {
              await sleep(0);
              continue;
            }

            await Promise.all(batch.map((path) => analyzeAndStore(path)));
            await sleep(hasEnoughCoverage() ? SCAN_IDLE_PAUSE_MS : SCAN_BATCH_PAUSE_MS);
          }
          scanRunning = false;
          queueSaveScoreCache();
        })();
      }

      async function waitForAnalyzed(targetCount) {
        ensureBackgroundScan();
        while (analyzedCount < targetCount && (scanRunning || scanIndex < scanOrder.length)) {
          await sleep(70);
        }
      }

      function buildScannedListForColor(colorId) {
        const list = [];
        for (const [path, scores] of scoreCache.entries()) {
          const fit = evaluateColorFit(scores, colorId);
          list.push({
            path,
            score: fit.target,
            strength: fit.strength,
            qualifies: fit.qualifies,
          });
        }
        return list;
      }

      async function pickByColor(colorId, requiredAnalyzed) {
        await waitForAnalyzed(requiredAnalyzed);
        const scanned = buildScannedListForColor(colorId);

        const pool = scanned
          .filter((x) => x.qualifies)
          .sort((a, b) => b.strength - a.strength)
          .slice(0, 140);

        if (!pool.length) {
          const softer = scanned
            .filter((x) => x.score >= 0.035)
            .sort((a, b) => b.score - a.score)
            .slice(0, 80);
          if (softer.length) {
            const count = randInt(1, 4);
            return weightedPick(softer, Math.min(count, softer.length));
          }
          const fallbackCount = randInt(1, 4);
          return shuffle(PHOTO_POOL).slice(0, fallbackCount).map((p) => ({ path: p, score: 0 }));
        }

        const count = randInt(1, 4);
        return weightedPick(pool, Math.min(count, pool.length));
      }

      function renderCards(list) {
        cardsEl.innerHTML = "";
        cardsEl.className = "cards";

        const templates = {
          leftStack: {
            1: [{ x: 14, y: 5, w: 72, h: 90 }],
            2: [
              { x: 4, y: 10, w: 48, h: 82 },
              { x: 44, y: 8, w: 48, h: 84 },
            ],
            3: [
              { x: 2, y: 16, w: 38, h: 74 },
              { x: 24, y: 5, w: 40, h: 76 },
              { x: 54, y: 15, w: 42, h: 78 },
            ],
            4: [
              { x: 2, y: 10, w: 34, h: 66 },
              { x: 20, y: 20, w: 34, h: 66 },
              { x: 44, y: 6, w: 34, h: 66 },
              { x: 64, y: 18, w: 32, h: 64 },
            ],
          },
          diagonal: {
            1: [{ x: 16, y: 5, w: 70, h: 90 }],
            2: [
              { x: 6, y: 6, w: 46, h: 80 },
              { x: 48, y: 16, w: 46, h: 80 },
            ],
            3: [
              { x: 2, y: 6, w: 36, h: 70 },
              { x: 32, y: 16, w: 36, h: 70 },
              { x: 62, y: 26, w: 34, h: 68 },
            ],
            4: [
              { x: 1, y: 4, w: 32, h: 62 },
              { x: 24, y: 12, w: 32, h: 62 },
              { x: 47, y: 20, w: 32, h: 62 },
              { x: 68, y: 28, w: 30, h: 60 },
            ],
          },
          radial: {
            1: [{ x: 15, y: 6, w: 70, h: 88 }],
            2: [
              { x: 11, y: 12, w: 38, h: 76 },
              { x: 51, y: 12, w: 38, h: 76 },
            ],
            3: [
              { x: 29, y: 2, w: 40, h: 74 },
              { x: 7, y: 24, w: 38, h: 72 },
              { x: 55, y: 24, w: 38, h: 72 },
            ],
            4: [
              { x: 32, y: 2, w: 36, h: 64 },
              { x: 6, y: 22, w: 34, h: 64 },
              { x: 32, y: 30, w: 36, h: 64 },
              { x: 60, y: 22, w: 34, h: 64 },
            ],
          },
          centerCascade: {
            1: [{ x: 18, y: 5, w: 64, h: 90 }],
            2: [
              { x: 21, y: 5, w: 56, h: 82 },
              { x: 24, y: 17, w: 52, h: 78 },
            ],
            3: [
              { x: 24, y: 2, w: 50, h: 72 },
              { x: 13, y: 16, w: 40, h: 70 },
              { x: 47, y: 20, w: 40, h: 70 },
            ],
            4: [
              { x: 25, y: 2, w: 44, h: 62 },
              { x: 8, y: 17, w: 35, h: 62 },
              { x: 33, y: 25, w: 35, h: 62 },
              { x: 58, y: 17, w: 35, h: 62 },
            ],
          },
          arcFlow: {
            1: [{ x: 17, y: 5, w: 68, h: 90 }],
            2: [
              { x: 8, y: 18, w: 44, h: 76 },
              { x: 50, y: 4, w: 44, h: 76 },
            ],
            3: [
              { x: 2, y: 21, w: 36, h: 68 },
              { x: 30, y: 8, w: 38, h: 70 },
              { x: 60, y: 2, w: 36, h: 68 },
            ],
            4: [
              { x: 2, y: 26, w: 30, h: 60 },

        const styleNames = Object.keys(templates);
        const style = templates[styleNames[Math.floor(Math.random() * styleNames.length)]];
        const layout = style[Math.max(1, Math.min(4, list.length))];
        for (let i = 0; i < list.length; i += 1) {
          const item = list[i];
          const slot = layout[i];
          const card = document.createElement("figure");
          card.className = "card";
          const jx = (Math.random() - 0.5) * 3.2;
          const jy = (Math.random() - 0.5) * 3.2;
          const jw = (Math.random() - 0.5) * 2.6;
          card.style.left = `${slot.x + jx}%`;
          card.style.top = `${slot.y + jy}%`;
          card.style.width = `${slot.w + jw}%`;
          card.style.zIndex = String(10 + i);
          card.style.setProperty("--rot", `${(Math.random() - 0.5) * 8}deg`);

          const img = document.createElement("img");
          img.src = item.path;
          img.alt = fileLabel(item.path);
          img.loading = "eager";

          card.addEventListener("pointerdown", () => {
            topZ += 1;
            for (const c of cardsEl.querySelectorAll(".card")) {
              c.classList.remove("front");
              c.style.setProperty("--zoom", "1");
            }
            card.classList.add("front");
            card.style.zIndex = String(topZ);
            card.style.setProperty("--zoom", "1.03");
          });

          card.appendChild(img);
          cardsEl.appendChild(card);
        }
      }

      function setBusy(flag) {
        busy = flag;
        for (const btn of paletteEl.querySelectorAll("button")) btn.disabled = flag;
      }

      async function runPick(color, options = {}) {
        if (busy || !PHOTO_POOL.length) return;
        currentColor = color;
        setBusy(true);
        ensureBackgroundScan();

        for (const btn of paletteEl.querySelectorAll("button")) {
          btn.classList.toggle("active", btn.dataset.color === color.id);
        }

        const countAsClick = options.countAsClick !== false;
        if (countAsClick) userPickCount += 1;
        const requiredAnalyzed = Math.min(PHOTO_POOL.length, (countAsClick ? userPickCount : 1) * 20);

        const list = await pickByColor(color.id, requiredAnalyzed);
        renderCards(list);

        setBusy(false);
      }

      function buildPalette() {
        paletteEl.innerHTML = "";
        for (const color of COLORS) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `color-btn ${color.className}`;
          btn.dataset.color = color.id;
          btn.textContent = color.label;
          btn.addEventListener("click", () => runPick(color));
          paletteEl.appendChild(btn);
        }
      }

      loadScoreCache();
      window.addEventListener("pagehide", saveScoreCacheNow);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) queueSaveScoreCache();
        else ensureBackgroundScan();
      });
      buildPalette();

      if (!PHOTO_POOL.length) {
        cardsEl.innerHTML = '<div class="empty">未检测到可用图片</div>';
      } else {
        ensureBackgroundScan();
        runPick(COLORS[5], { countAsClick: false });
      }
