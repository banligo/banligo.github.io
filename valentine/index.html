---
layout: none
---
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Memory</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap");

      :root {
        --rose: #ff5fa6;
        --gold: #ffbf2e;
        --cream: #f6fbff;
        --wine: #24496f;
        --bg-deep: #0a2e53;
        --panel: rgba(243, 251, 255, 0.88);
        --panel-border: rgba(255, 255, 255, 0.82);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overscroll-behavior: none;
      }

      body {
        margin: 0;
        overflow: hidden;
        touch-action: none;
        color: var(--cream);
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #000;
      }

      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      .top-bar {
        position: fixed;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        right: max(14px, env(safe-area-inset-right));
        z-index: 12;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        pointer-events: none;
      }

      .title-box,
      .control-box {
        pointer-events: auto;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(10px);
        color: var(--wine);
        border-radius: 14px;
      }

      .title-box {
        max-width: min(560px, 74vw);
        padding: 14px 16px 12px;
      }

      .title-box h1 {
        margin: 0 0 4px;
        line-height: 1;
        font-size: clamp(1.4rem, 2.2vw, 2rem);
        font-family: "Cormorant Garamond", serif;
        letter-spacing: 0.02em;
      }

      .title-box p {
        margin: 0;
        color: #2e608a;
        font-size: 0.9rem;
      }

      .control-box {
        min-width: 120px;
        max-width: 200px;
        padding: 8px 9px;
      }

      .status-line {
        margin: 0 0 4px;
        font-size: 0.9rem;
        font-weight: 700;
        color: #1d5a8f;
        letter-spacing: 0.01em;
      }

      .controls {
        font-size: 0.8rem;
        line-height: 1.32;
        color: #2f5f87;
      }

      .focus-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        opacity: 0;
        pointer-events: none;
        transition: opacity 320ms cubic-bezier(0.22, 1, 0.36, 1);
        background:
          radial-gradient(circle at 18% 20%, rgba(255, 193, 216, 0.22), rgba(255, 193, 216, 0) 45%),
          radial-gradient(circle at 82% 72%, rgba(181, 228, 255, 0.28), rgba(181, 228, 255, 0) 50%),
          linear-gradient(145deg, rgba(18, 38, 68, 0.52), rgba(8, 24, 48, 0.64));
        backdrop-filter: blur(10px) saturate(112%);
      }

      .focus-overlay.show {
        opacity: 1;
        pointer-events: auto;
      }

      .focus-card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) translateY(16px) scale(0.962);
        width: min(500px, calc(100vw - 26px));
        background: linear-gradient(154deg, rgba(255, 248, 242, 0.94), rgba(239, 248, 255, 0.9));
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 18px;
        color: #6e2442;
        box-shadow:
          0 34px 68px rgba(8, 22, 42, 0.42),
          0 8px 26px rgba(114, 40, 74, 0.18);
        padding: 14px;
        transition:
          transform 360ms cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 360ms ease,
          opacity 260ms ease;
        overflow: hidden;
        isolation: isolate;
      }

      .focus-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(
          130deg,
          rgba(255, 255, 255, 0.85),
          rgba(255, 199, 219, 0.58),
          rgba(171, 221, 252, 0.6)
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      .focus-card::after {
        content: "";
        position: absolute;
        left: -40%;
        top: -28%;
        width: 80%;
        height: 68%;
        background: linear-gradient(
          128deg,
          rgba(255, 255, 255, 0) 16%,
          rgba(255, 255, 255, 0.34) 48%,
          rgba(255, 255, 255, 0) 82%
        );
        transform: rotate(-11deg);
        opacity: 0.68;
        pointer-events: none;
        animation: focusSheen 6.6s ease-in-out infinite;
      }

      .focus-overlay.show .focus-card {
        transform: translate(-50%, -50%) scale(1);
        box-shadow:
          0 40px 78px rgba(8, 22, 42, 0.46),
          0 10px 30px rgba(114, 40, 74, 0.2);
      }

      .focus-card.switching .focus-photo,
      .focus-card.switching .focus-text-wrap,
      .focus-card.switching .focus-hint {
        opacity: 0.15;
        transform: translateY(5px) scale(0.99);
      }

      .focus-photo {
        width: 100%;
        height: auto;
        max-height: min(74vh, 560px);
        object-fit: contain;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.54), rgba(253, 243, 248, 0.42));
        border-radius: 13px;
        border: 1px solid rgba(255, 255, 255, 0.86);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.25),
          0 16px 32px rgba(12, 38, 71, 0.24);
        display: none;
        transition: opacity 240ms ease, transform 240ms ease;
      }

      .focus-text-wrap {
        display: none;
        background: linear-gradient(140deg, rgba(255, 232, 242, 0.9), rgba(255, 241, 220, 0.84));
        border-radius: 13px;
        border: 1px solid rgba(255, 255, 255, 0.86);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.55),
          0 12px 28px rgba(12, 38, 71, 0.14);
        padding: 15px 16px 14px;
        transition: opacity 240ms ease, transform 240ms ease;
      }

      .focus-text-wrap h2 {
        margin: 0 0 10px;
        font-family: "Cormorant Garamond", serif;
        font-size: 1.42rem;
        letter-spacing: 0.02em;
        color: #8f1f46;
      }

      .focus-text-wrap p {
        margin: 0;
        line-height: 1.8;
        font-size: 1rem;
        color: #5f3047;
      }

      .focus-hint {
        margin: 10px 2px 0;
        text-align: center;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        color: rgba(96, 62, 79, 0.78);
        transition: opacity 240ms ease, transform 240ms ease;
      }

      @keyframes focusSheen {
        0% {
          transform: translateX(-22%) rotate(-11deg);
          opacity: 0.18;
        }
        45% {
          opacity: 0.68;
        }
        100% {
          transform: translateX(74%) rotate(-11deg);
          opacity: 0.12;
        }
      }

      @media (max-width: 900px) {
        .top-bar {
          flex-direction: column;
          align-items: flex-start;
        }

        .title-box,
        .control-box {
          max-width: 100%;
        }

        .focus-card {
          width: min(460px, calc(100vw - 18px));
          border-radius: 16px;
          padding: 12px;
        }

        .focus-text-wrap h2 {
          font-size: 1.3rem;
        }

        .focus-text-wrap p {
          font-size: 0.95rem;
          line-height: 1.72;
        }

      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>

      <div class="top-bar">
      <div class="control-box">
        <p id="statusLine" class="status-line">聚合 0%</p>
        <div class="controls">
          缩放或点击 💗
        </div>
      </div>
    </div>

    <div id="focusOverlay" class="focus-overlay">
      <div class="focus-card" id="focusCard">
        <img id="focusPhoto" class="focus-photo" alt="selected photo" />
        <div id="focusTextWrap" class="focus-text-wrap">
          <h2>悄悄话</h2>
          <p id="focusText"></p>
        </div>
        <!-- <p class="focus-hint">点击卡片切换随机回忆 · 点击空白关闭</p> -->
      </div>
    </div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";
      import { LOVE_MESSAGES } from "./content/messages.js";

      const PHOTO_URLS = [
        {%- assign _image_exts = ".jpg,.jpeg,.png,.webp,.gif,.avif,.bmp,.svg" -%}
        {%- assign _first_photo = true -%}
        {%- assign _sorted_files = site.static_files | sort: "path" -%}
        {%- for f in _sorted_files -%}
          {%- assign _ext = f.extname | downcase -%}
          {%- if f.path contains "/valentine/content/photos/" and _image_exts contains _ext -%}
            {%- unless _first_photo -%}, {%- endunless -%}"{{ f.path | relative_url }}"
            {%- assign _first_photo = false -%}
          {%- endif -%}
        {%- endfor -%}
      ];

      /* ---------------------------
       * 可配置区
       * --------------------------- */
      const THEME_COLORS = {
        rose: "#ff5fa6",
        gold: "#ffbf2e",
        cream: "#f6fbff",
        wine: "#24496f",
        glow: "#89d7ff",
        sky: "#4ab0ff",
        azure: "#2b86da",
      };

      const APP_STATE = {
        MAIN: "main",
        FOCUS: "focus",
      };

      const FOCUS_KIND = {
        NONE: "none",
        PHOTO: "photo",
        TEXT: "text",
      };

      /* ---------------------------
       * 基础对象
       * --------------------------- */
      const isMobile = window.matchMedia("(max-width: 860px)").matches;
      const HEART_INSTANCE_COUNT = isMobile ? 380 : 660;
      const SPARK_COUNT = isMobile ? 240 : 420;
      const DUST_COUNT = isMobile ? 900 : 1600;
      const GLINT_COUNT = isMobile ? 220 : 360;
      const DRAG_GLITTER_COUNT = isMobile ? 420 : 760;
      const MAX_PHOTO_CARDS = PHOTO_URLS.length;
      const MAX_TEXT_CHIPS = isMobile ? 8 : 10;

      const canvas = document.getElementById("scene");
      const statusLine = document.getElementById("statusLine");

      const focusOverlay = document.getElementById("focusOverlay");
      const focusCard = document.getElementById("focusCard");
      const focusPhotoEl = document.getElementById("focusPhoto");
      const focusTextWrap = document.getElementById("focusTextWrap");
      const focusTextEl = document.getElementById("focusText");

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x040404, 0.018);

      const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 120);
      const cameraRig = {
        yaw: 0,
        pitch: 0.18,
        targetYaw: 0,
        targetPitch: 0.18,
        radius: 8.6,
        targetRadius: 8.6,
      };

      const MORPH_RANGE = {
        minRadius: 5.8,
        maxRadius: 11.8,
      };

      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();
      const tmpObject = new THREE.Object3D();
      const tmpVec = new THREE.Vector3();
      const tmpVecB = new THREE.Vector3();

      const clock = new THREE.Clock();

      const ambient = new THREE.AmbientLight(0xe8f6ff, 0.78);
      const keyLight = new THREE.PointLight(0xffd9b0, 14, 42, 2);
      keyLight.position.set(4.2, 4.4, 4.6);
      const rimLight = new THREE.PointLight(0x7bc4ff, 9.2, 40, 2);
      rimLight.position.set(-5.2, -2, -4.2);
      scene.add(ambient, keyLight, rimLight);

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function clamp(v, min, max) {
        return Math.min(max, Math.max(min, v));
      }

      function getZoomMorph() {
        return clamp(
          (cameraRig.radius - MORPH_RANGE.minRadius) / (MORPH_RANGE.maxRadius - MORPH_RANGE.minRadius),
          0,
          1
        );
      }

      function randomInSphere(minR, maxR) {
        const u = Math.random();
        const v = Math.random();
        const theta = Math.PI * 2 * u;
        const phi = Math.acos(2 * v - 1);
        const r = lerp(minR, maxR, Math.cbrt(Math.random()));
        return new THREE.Vector3(
          r * Math.sin(phi) * Math.cos(theta),
          r * Math.cos(phi) * 0.8,
          r * Math.sin(phi) * Math.sin(theta)
        );
      }

      function heartCurve2D(t) {
        const x = (16 * Math.pow(Math.sin(t), 3)) / 16;
        const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16;
        return new THREE.Vector2(x * 0.92, y * 0.92);
      }

      function sampleHeartVolume(scale = 2.8) {
        const t = Math.random() * Math.PI * 2;
        const radial = Math.sqrt(Math.random());
        const base = heartCurve2D(t);
        const x = base.x * radial;
        const y = base.y * radial;
        const depth = (Math.random() - 0.5) * (1 - radial * 0.62) * 1.8;

        return new THREE.Vector3(x * scale, y * scale * 1.04 + 0.68, depth * scale * 0.72);
      }

      // Hollow heart shell sampler: denser near outer contour, sparse in the core.
      function sampleHeartShell(scale = 2.8, shellMin = 0.7, shellExponent = 0.34) {
        const t = Math.random() * Math.PI * 2;
        const radial = shellMin + Math.pow(Math.random(), shellExponent) * (1 - shellMin);
        const base = heartCurve2D(t);
        const x = base.x * radial;
        const y = base.y * radial;
        const depthSpread = 0.5 + (1 - radial) * 0.5;
        const depth = (Math.random() - 0.5) * depthSpread * 1.8;
        return new THREE.Vector3(x * scale, y * scale * 1.04 + 0.68, depth * scale * 0.72);
      }

      function createHeartGeometry() {
        const s = new THREE.Shape();
        s.moveTo(0, 0.34);
        s.bezierCurveTo(0, 0.58, -0.31, 0.8, -0.56, 0.58);
        s.bezierCurveTo(-0.84, 0.35, -0.74, -0.07, -0.48, -0.31);
        s.bezierCurveTo(-0.22, -0.52, 0.01, -0.37, 0, -0.16);
        s.bezierCurveTo(0.01, -0.37, 0.23, -0.52, 0.48, -0.31);
        s.bezierCurveTo(0.74, -0.07, 0.84, 0.35, 0.56, 0.58);
        s.bezierCurveTo(0.31, 0.8, 0, 0.58, 0, 0.34);

        const g = new THREE.ExtrudeGeometry(s, {
          depth: 0.22,
          bevelEnabled: true,
          bevelSegments: 2,
          bevelSize: 0.03,
          bevelThickness: 0.05,
          curveSegments: 14,
        });
        g.scale(0.115, 0.115, 0.115);
        g.center();
        g.computeVertexNormals();
        return g;
      }

      // 背景使用 CSS 渐变，不再添加随视角转动的 3D 背景层。

      /* ---------------------------
       * 立体心形粒子
       * --------------------------- */
      const heartGeom = createHeartGeometry();
      const heartMat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(THEME_COLORS.gold),
        emissive: new THREE.Color(THEME_COLORS.rose),
        emissiveIntensity: 0.62,
        roughness: 0.18,
        metalness: 0.7,
        clearcoat: 0.68,
        clearcoatRoughness: 0.24,
        vertexColors: true,
        transparent: true,
        opacity: 0.94,
      });
      const heartMesh = new THREE.InstancedMesh(heartGeom, heartMat, HEART_INSTANCE_COUNT);
      heartMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      scene.add(heartMesh);

      const sparkGeom = new THREE.SphereGeometry(0.046, 8, 8);
      const sparkMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(THEME_COLORS.sky),
        emissive: new THREE.Color(THEME_COLORS.azure),
        emissiveIntensity: 1.38,
        roughness: 0.22,
        metalness: 0.02,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexColors: true,
        transparent: true,
        opacity: 0.95,
      });
      const sparkMesh = new THREE.InstancedMesh(sparkGeom, sparkMat, SPARK_COUNT);
      sparkMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      scene.add(sparkMesh);

      function createSoftDotTexture() {
        const c = document.createElement("canvas");
        c.width = 128;
        c.height = 128;
        const ctx = c.getContext("2d");
        const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 64);
        g.addColorStop(0, "rgba(255,255,255,1)");
        g.addColorStop(0.45, "rgba(255,255,255,0.86)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 128, 128);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      const dustGeometry = new THREE.BufferGeometry();
      const dustPositions = new Float32Array(DUST_COUNT * 3);
      const dustColors = new Float32Array(DUST_COUNT * 3);
      const dustSizes = new Float32Array(DUST_COUNT);
      const dustParticles = [];

      const glintGeometry = new THREE.BufferGeometry();
      const glintPositions = new Float32Array(GLINT_COUNT * 3);
      const glintColors = new Float32Array(GLINT_COUNT * 3);
      const glintSizes = new Float32Array(GLINT_COUNT);
      const glintParticles = [];

      const hearts = [];
      for (let i = 0; i < HEART_INSTANCE_COUNT; i += 1) {
        hearts.push({
          pos: sampleHeartShell(2.35, 0.72, 0.3),
          heartPos: sampleHeartShell(2.35, 0.72, 0.3),
          wanderPos: randomInSphere(3.4, 8.2),
          rot: new THREE.Euler(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI),
          scale: 0.5 + Math.random() * 0.9,
          phase: Math.random() * Math.PI * 2,
        });
      }

      const sparks = [];
      for (let i = 0; i < SPARK_COUNT; i += 1) {
        sparks.push({
          pos: sampleHeartShell(2.55, 0.68, 0.36),
          heartPos: sampleHeartShell(2.55, 0.68, 0.36),
          wanderPos: randomInSphere(3, 9),
          scale: 0.5 + Math.random() * 1.2,
          phase: Math.random() * Math.PI * 2,
        });
      }

      const dustColorA = new THREE.Color(THEME_COLORS.cream);
      const dustColorB = new THREE.Color(THEME_COLORS.sky);
      const dustColorMix = new THREE.Color();
      for (let i = 0; i < DUST_COUNT; i += 1) {
        const heartPos = sampleHeartShell(2.6, 0.7, 0.34);
        const wanderPos = randomInSphere(3.8, 9.8);
        const pos = heartPos.clone();
        const phase = Math.random() * Math.PI * 2;
        const size = 0.06 + Math.random() * 0.1;
        dustParticles.push({ heartPos, wanderPos, pos, phase, size });
        dustPositions[i * 3] = pos.x;
        dustPositions[i * 3 + 1] = pos.y;
        dustPositions[i * 3 + 2] = pos.z;
        dustSizes[i] = size;
        const mixT = 0.25 + Math.abs(Math.sin(phase * 1.5)) * 0.7;
        dustColorMix.copy(dustColorA).lerp(dustColorB, mixT);
        dustColors[i * 3] = dustColorMix.r;
        dustColors[i * 3 + 1] = dustColorMix.g;
        dustColors[i * 3 + 2] = dustColorMix.b;
      }
      dustGeometry.setAttribute("position", new THREE.BufferAttribute(dustPositions, 3));
      dustGeometry.setAttribute("color", new THREE.BufferAttribute(dustColors, 3));
      dustGeometry.setAttribute("size", new THREE.BufferAttribute(dustSizes, 1));

      const dustMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) },
          uMap: { value: createSoftDotTexture() },
          uOpacity: { value: 0.84 },
        },
        vertexShader: `
          attribute float size;
          varying vec3 vColor;
          varying float vPulse;
          uniform float uTime;
          uniform float uPixelRatio;
          void main() {
            vColor = color;
            vPulse = 0.68 + 0.32 * sin(uTime * 1.5 + position.x * 0.55 + position.y * 0.35);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = size * (90.0 / -mvPosition.z) * uPixelRatio * vPulse;
          }
        `,
        fragmentShader: `
          uniform sampler2D uMap;
          uniform float uOpacity;
          varying vec3 vColor;
          varying float vPulse;
          void main() {
            vec4 tex = texture2D(uMap, gl_PointCoord);
            float alpha = tex.a * uOpacity * vPulse;
            gl_FragColor = vec4(vColor, alpha);
          }
        `,
        vertexColors: true,
      });
      const dustPoints = new THREE.Points(dustGeometry, dustMaterial);
      scene.add(dustPoints);

      const glintColorA = new THREE.Color(THEME_COLORS.rose);
      const glintColorB = new THREE.Color(THEME_COLORS.cream);
      const glintColorMix = new THREE.Color();
      for (let i = 0; i < GLINT_COUNT; i += 1) {
        const heartPos = sampleHeartShell(2.25, 0.74, 0.28);
        const wanderPos = randomInSphere(4.4, 11.3);
        const pos = heartPos.clone();
        const phase = Math.random() * Math.PI * 2;
        const size = 0.11 + Math.random() * 0.16;
        glintParticles.push({ heartPos, wanderPos, pos, phase, size });
        glintPositions[i * 3] = pos.x;
        glintPositions[i * 3 + 1] = pos.y;
        glintPositions[i * 3 + 2] = pos.z;
        glintSizes[i] = size;
        const mixT = 0.2 + Math.abs(Math.cos(phase * 1.3)) * 0.72;
        glintColorMix.copy(glintColorA).lerp(glintColorB, mixT);
        glintColors[i * 3] = glintColorMix.r;
        glintColors[i * 3 + 1] = glintColorMix.g;
        glintColors[i * 3 + 2] = glintColorMix.b;
      }
      glintGeometry.setAttribute("position", new THREE.BufferAttribute(glintPositions, 3));
      glintGeometry.setAttribute("color", new THREE.BufferAttribute(glintColors, 3));
      glintGeometry.setAttribute("size", new THREE.BufferAttribute(glintSizes, 1));

      const glintMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) },
          uMap: { value: createSoftDotTexture() },
          uOpacity: { value: 0.62 },
        },
        vertexShader: `
          attribute float size;
          varying vec3 vColor;
          varying float vPulse;
          uniform float uTime;
          uniform float uPixelRatio;
          void main() {
            vColor = color;
            float baseTwinkle = 0.4 + 0.6 * sin(uTime * 0.95 + position.x * 0.32 + position.z * 0.42);
            float burst = pow(max(sin(uTime * 2.2 + position.x * 1.15 + position.y * 0.85), 0.0), 7.0);
            vPulse = baseTwinkle + burst * 1.35;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = size * (118.0 / -mvPosition.z) * uPixelRatio * vPulse;
          }
        `,
        fragmentShader: `
          uniform sampler2D uMap;
          uniform float uOpacity;
          varying vec3 vColor;
          varying float vPulse;
          void main() {
            vec4 tex = texture2D(uMap, gl_PointCoord);
            float alpha = tex.a * uOpacity * vPulse;
            gl_FragColor = vec4(vColor, alpha);
          }
        `,
        vertexColors: true,
      });
      const glintPoints = new THREE.Points(glintGeometry, glintMaterial);
      scene.add(glintPoints);

      const dragGlitterGeometry = new THREE.BufferGeometry();
      const dragGlitterPositions = new Float32Array(DRAG_GLITTER_COUNT * 3);
      const dragGlitterColors = new Float32Array(DRAG_GLITTER_COUNT * 3);
      const dragGlitterSizes = new Float32Array(DRAG_GLITTER_COUNT);
      const dragGlitterAlphas = new Float32Array(DRAG_GLITTER_COUNT);
      const dragGlitterParticles = [];
      let dragGlitterCursor = 0;
      const dragEmitDir = new THREE.Vector3();
      const dragEmitFacing = new THREE.Vector3();
      const dragColorA = new THREE.Color(THEME_COLORS.cream);
      const dragColorB = new THREE.Color(THEME_COLORS.gold);
      const dragColorMix = new THREE.Color();
      const AMBIENT_GLITTER_RATE = isMobile ? 14 : 22;
      let ambientGlitterCarry = 0;
      let ambientGlitterSeeded = false;

      for (let i = 0; i < DRAG_GLITTER_COUNT; i += 1) {
        dragGlitterParticles.push({
          pos: new THREE.Vector3(0, 0, 0),
          vel: new THREE.Vector3(0, 0, 0),
          life: 0,
          maxLife: 1,
          size: 0.12,
          twinkle: Math.random() * Math.PI * 2,
          intensity: 0,
          r: dragColorA.r,
          g: dragColorA.g,
          b: dragColorA.b,
        });
        dragGlitterPositions[i * 3] = 0;
        dragGlitterPositions[i * 3 + 1] = 0;
        dragGlitterPositions[i * 3 + 2] = 0;
        dragGlitterSizes[i] = 0.12;
        dragGlitterAlphas[i] = 0;
        dragGlitterColors[i * 3] = dragColorA.r;
        dragGlitterColors[i * 3 + 1] = dragColorA.g;
        dragGlitterColors[i * 3 + 2] = dragColorA.b;
      }

      dragGlitterGeometry.setAttribute("position", new THREE.BufferAttribute(dragGlitterPositions, 3));
      dragGlitterGeometry.setAttribute("color", new THREE.BufferAttribute(dragGlitterColors, 3));
      dragGlitterGeometry.setAttribute("size", new THREE.BufferAttribute(dragGlitterSizes, 1));
      dragGlitterGeometry.setAttribute("alpha", new THREE.BufferAttribute(dragGlitterAlphas, 1));

      const dragGlitterMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) },
          uMap: { value: createSoftDotTexture() },
        },
        vertexShader: `
          attribute float size;
          attribute float alpha;
          varying vec3 vColor;
          varying float vAlpha;
          uniform float uTime;
          uniform float uPixelRatio;
          void main() {
            vColor = color;
            float sparkle = 0.75 + 0.25 * sin(uTime * 9.2 + position.x * 4.1 + position.y * 2.7);
            vAlpha = alpha * sparkle;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = size * (122.0 / -mvPosition.z) * uPixelRatio;
          }
        `,
        fragmentShader: `
          uniform sampler2D uMap;
          varying vec3 vColor;
          varying float vAlpha;
          void main() {
            vec2 uv = gl_PointCoord - vec2(0.5);
            float cross = pow(max(1.0 - abs(uv.x) * 2.8, 0.0), 5.0)
                        + pow(max(1.0 - abs(uv.y) * 2.8, 0.0), 5.0);
            vec4 tex = texture2D(uMap, gl_PointCoord);
            float alpha = tex.a * vAlpha * (0.72 + cross * 0.45);
            gl_FragColor = vec4(vColor, alpha);
          }
        `,
        vertexColors: true,
      });
      const dragGlitterPoints = new THREE.Points(dragGlitterGeometry, dragGlitterMaterial);
      scene.add(dragGlitterPoints);

      function emitAmbientDragGlitter(count) {
        for (let i = 0; i < count; i += 1) {
          const particle = dragGlitterParticles[dragGlitterCursor];
          dragEmitDir
            .set((Math.random() - 0.5) * 1.45, (Math.random() - 0.34) * 1.25, (Math.random() - 0.5) * 1.45)
            .normalize();

          const spawnRadius = 1.95 + Math.random() * 1.08;
          particle.pos.copy(dragEmitDir).multiplyScalar(spawnRadius);
          particle.vel.copy(dragEmitDir).multiplyScalar(0.5 + Math.random() * 0.9);
          particle.vel.x += (Math.random() - 0.5) * 0.25;
          particle.vel.y += (Math.random() - 0.32) * 0.22;
          particle.vel.z += (Math.random() - 0.5) * 0.25;
          particle.life = 1.35 + Math.random() * 1.95;
          particle.maxLife = particle.life;
          particle.size = 0.08 + Math.random() * 0.11;
          particle.twinkle = Math.random() * Math.PI * 2;
          particle.intensity = (5 + Math.random() * 3);
          dragColorMix.copy(dragColorA).lerp(dragColorB, 0.08 + Math.random() * 0.42);
          particle.r = dragColorMix.r;
          particle.g = dragColorMix.g;
          particle.b = dragColorMix.b;

          dragGlitterCursor = (dragGlitterCursor + 1) % dragGlitterParticles.length;
        }
      }

      function emitDragGlitterBurst(speedPx) {
        const burstCount = clamp(Math.floor(speedPx * 0.42) + 5, 7, isMobile ? 24 : 36);
        const burstStrength = clamp(speedPx * 0.028, 0.26, 2.4);
        dragEmitFacing.copy(camera.position).normalize();
        for (let i = 0; i < burstCount; i += 1) {
          const particle = dragGlitterParticles[dragGlitterCursor];
          dragEmitDir
            .set((Math.random() - 0.5) * 1.45, (Math.random() - 0.38) * 1.35, (Math.random() - 0.5) * 1.45)
            .normalize()
            .lerp(dragEmitFacing, 0.22)
            .normalize();

          const spawnRadius = 2.05 + Math.random() * 0.62;
          particle.pos.copy(dragEmitDir).multiplyScalar(spawnRadius);
          particle.vel.copy(dragEmitDir).multiplyScalar(2.8 + Math.random() * 3.3 + burstStrength * 2.3);
          particle.vel.x += (Math.random() - 0.5) * 0.9;
          particle.vel.y += (Math.random() - 0.45) * 0.85;
          particle.vel.z += (Math.random() - 0.5) * 0.9;
          particle.life = 0.74 + Math.random() * 0.72;
          particle.maxLife = particle.life;
          particle.size = 0.14 + Math.random() * 0.2 + burstStrength * 0.055;
          particle.twinkle = Math.random() * Math.PI * 2;
          particle.intensity = 0.9 + Math.random() * 0.42;
          dragColorMix.copy(dragColorA).lerp(dragColorB, 0.25 + Math.random() * 0.75);
          particle.r = dragColorMix.r;
          particle.g = dragColorMix.g;
          particle.b = dragColorMix.b;

          dragGlitterCursor = (dragGlitterCursor + 1) % dragGlitterParticles.length;
        }
      }

      const heartColorA = new THREE.Color(THEME_COLORS.rose);
      const heartColorB = new THREE.Color(THEME_COLORS.gold);
      const heartColorMix = new THREE.Color();
      for (let i = 0; i < HEART_INSTANCE_COUNT; i += 1) {
        const p = hearts[i];
        const mixT = 0.28 + Math.abs(Math.sin(p.phase)) * 0.62;
        heartColorMix.copy(heartColorA).lerp(heartColorB, mixT);
        heartMesh.setColorAt(i, heartColorMix);
      }
      if (heartMesh.instanceColor) {
        heartMesh.instanceColor.needsUpdate = true;
      }

      const sparkColorA = new THREE.Color(THEME_COLORS.azure);
      const sparkColorB = new THREE.Color(THEME_COLORS.glow);
      const sparkColorMix = new THREE.Color();
      for (let i = 0; i < SPARK_COUNT; i += 1) {
        const p = sparks[i];
        const mixT = 0.34 + Math.abs(Math.cos(p.phase * 1.4)) * 0.62;
        sparkColorMix.copy(sparkColorA).lerp(sparkColorB, mixT);
        sparkMesh.setColorAt(i, sparkColorMix);
      }
      if (sparkMesh.instanceColor) {
        sparkMesh.instanceColor.needsUpdate = true;
      }

      /* ---------------------------
       * 照片与悄悄话对象
       * --------------------------- */
      const textureLoader = new THREE.TextureLoader();
      textureLoader.crossOrigin = "anonymous";

      const activePhotoUrls = PHOTO_URLS.slice();
      const photoOverlaySources = new Array(MAX_PHOTO_CARDS).fill("");
      const PHOTO_BASE = {
        planeW: 0.64,
        planeH: 0.88,
        frameW: 0.72,
        frameH: 0.98,
        haloW: 0.82,
        haloH: 1.08,
      };
      const DEFAULT_PHOTO_ASPECT = PHOTO_BASE.planeW / PHOTO_BASE.planeH;

      function applyPhotoAspect(card, aspectRatio) {
        const aspect = aspectRatio > 0 ? aspectRatio : DEFAULT_PHOTO_ASPECT;
        const maxW = 0.74;
        const maxH = 0.9;
        let displayW;
        let displayH;
        if (aspect >= maxW / maxH) {
          displayW = maxW;
          displayH = displayW / aspect;
        } else {
          displayH = maxH;
          displayW = displayH * aspect;
        }

        card.photoPlane.scale.set(displayW / PHOTO_BASE.planeW, displayH / PHOTO_BASE.planeH, 1);
        card.frame.scale.set((displayW + 0.08) / PHOTO_BASE.frameW, (displayH + 0.08) / PHOTO_BASE.frameH, 1);
        card.halo.scale.set((displayW + 0.18) / PHOTO_BASE.haloW, (displayH + 0.18) / PHOTO_BASE.haloH, 1);
      }

      function createTextChipTexture(text, i) {
        const c = document.createElement("canvas");
        c.width = 700;
        c.height = 300;
        const ctx = c.getContext("2d");

        const g = ctx.createLinearGradient(0, 0, c.width, c.height);
        g.addColorStop(0, "#ffe6ef");
        g.addColorStop(1, "#ffe7c8");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, c.width, c.height);

        ctx.fillStyle = "rgba(96, 24, 48, 0.78)";
        ctx.font = "700 44px 'Noto Sans SC'";
        ctx.fillText(`悄悄话 ${i + 1}`, 36, 78);

        const preview = text.length > 16 ? `${text.slice(0, 16)}...` : text;
        ctx.font = "500 33px 'Noto Sans SC'";
        ctx.fillText(preview, 36, 140);

        ctx.strokeStyle = "rgba(255,255,255,0.55)";
        ctx.lineWidth = 4;
        ctx.strokeRect(14, 14, c.width - 28, c.height - 28);

        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      function loadTexture(url) {
        if (!url) {
          return Promise.resolve({ texture: null, src: "" });
        }
        return new Promise((resolve) => {
          textureLoader.load(
            url,
            (texture) => {
              texture.colorSpace = THREE.SRGBColorSpace;
              texture.anisotropy = renderer.capabilities.getMaxAnisotropy() || 1;
              resolve({ texture, src: url });
            },
            undefined,
            () => resolve({ texture: null, src: "" })
          );
        });
      }

      const photoRoot = new THREE.Group();
      const textRoot = new THREE.Group();
      scene.add(photoRoot, textRoot);

      const photoCards = [];
      const photoPickMeshes = [];
      const textCards = [];
      const textPickMeshes = [];

      function buildPhotoCards() {
        for (let i = 0; i < MAX_PHOTO_CARDS; i += 1) {
          const cardGroup = new THREE.Group();

          const frame = new THREE.Mesh(
            new THREE.PlaneGeometry(0.72, 0.98),
            new THREE.MeshPhysicalMaterial({
              color: new THREE.Color(THEME_COLORS.cream),
              emissive: new THREE.Color(THEME_COLORS.wine),
              emissiveIntensity: 0.09,
              roughness: 0.3,
              metalness: 0.13,
              transparent: true,
              opacity: 0.92,
            })
          );
          frame.position.z = -0.01;
          cardGroup.add(frame);

          const photoMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.2,
            metalness: 0.06,
            transparent: true,
            opacity: 0.95,
          });
          const photoPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.64, 0.88), photoMat);
          photoPlane.userData.pickType = FOCUS_KIND.PHOTO;
          photoPlane.userData.pickIndex = i;
          cardGroup.add(photoPlane);

          const halo = new THREE.Mesh(
            new THREE.PlaneGeometry(0.82, 1.08),
            new THREE.MeshBasicMaterial({
              color: new THREE.Color(THEME_COLORS.rose),
              transparent: true,
              opacity: 0.06,
              blending: THREE.AdditiveBlending,
              depthWrite: false,
            })
          );
          halo.position.z = -0.03;
          cardGroup.add(halo);

          photoRoot.add(cardGroup);
          photoPickMeshes.push(photoPlane);

          photoCards.push({
            group: cardGroup,
            frame,
            photoPlane,
            photoMat,
            halo,
            pos: sampleHeartVolume(2.3),
            heartPos: sampleHeartVolume(2.3),
            wanderPos: randomInSphere(2.8, 6.8),
            phase: Math.random() * Math.PI * 2,
            scale: 0.46 + Math.random() * 0.14,
          });
          applyPhotoAspect(photoCards[photoCards.length - 1], DEFAULT_PHOTO_ASPECT);
        }
      }

      function buildTextCards() {
        for (let i = 0; i < MAX_TEXT_CHIPS; i += 1) {
          const tex = createTextChipTexture(LOVE_MESSAGES[i % LOVE_MESSAGES.length], i);
          const mat = new THREE.MeshStandardMaterial({
            map: tex,
            color: 0xffffff,
            roughness: 0.24,
            metalness: 0.06,
            transparent: true,
            opacity: 0.9,
          });
          const chip = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.24), mat);
          chip.userData.pickType = FOCUS_KIND.TEXT;
          chip.userData.pickIndex = i;

          const shell = new THREE.Mesh(
            new THREE.PlaneGeometry(0.7, 0.32),
            new THREE.MeshPhysicalMaterial({
              color: new THREE.Color(THEME_COLORS.cream),
              emissive: new THREE.Color(THEME_COLORS.rose),
              emissiveIntensity: 0.08,
              roughness: 0.36,
              metalness: 0.1,
              transparent: true,
              opacity: 0.82,
            })
          );
          shell.position.z = -0.01;

          const group = new THREE.Group();
          group.add(shell, chip);
          textRoot.add(group);
          textPickMeshes.push(chip);

          textCards.push({
            group,
            shell,
            chip,
            mat,
            pos: sampleHeartVolume(2.2),
            heartPos: sampleHeartVolume(2.2),
            wanderPos: randomInSphere(2.6, 6.4),
            phase: Math.random() * Math.PI * 2,
            scale: 0.36 + Math.random() * 0.1,
            textIndex: i % LOVE_MESSAGES.length,
          });
        }
      }

      async function setPhotoTextures(urls) {
        const tasks = [];
        for (let i = 0; i < photoCards.length; i += 1) {
          tasks.push(loadTexture(urls[i]));
        }
        const loaded = await Promise.all(tasks);
        for (let i = 0; i < photoCards.length; i += 1) {
          const { texture, src } = loaded[i];
          const card = photoCards[i];
          if (!texture) {
            if (card.photoMat.map) {
              card.photoMat.map.dispose();
              card.photoMat.map = null;
              card.photoMat.needsUpdate = true;
            }
            card.group.visible = false;
            photoOverlaySources[i] = "";
            continue;
          }
          if (card.photoMat.map && card.photoMat.map !== texture) {
            card.photoMat.map.dispose();
          }
          const img = texture.image;
          const aspect =
            img && img.width && img.height ? img.width / img.height : DEFAULT_PHOTO_ASPECT;
          applyPhotoAspect(card, aspect);
          card.group.visible = true;
          card.photoMat.map = texture;
          card.photoMat.needsUpdate = true;
          photoOverlaySources[i] = src;
        }
      }

      buildPhotoCards();
      buildTextCards();
      setPhotoTextures(activePhotoUrls);

      /* ---------------------------
       * 状态控制
       * --------------------------- */
      let currentState = APP_STATE.MAIN;
      let focusKind = FOCUS_KIND.NONE;
      let focusIndex = 0;
      let focusSwapTimer = 0;

      function updateStatus() {
        if (currentState === APP_STATE.FOCUS) {
          const kindLabel = focusKind === FOCUS_KIND.PHOTO ? "查看照片" : "查看悄悄话";
          statusLine.textContent = `状态：${kindLabel}`;
          return;
        }
        const morph = getZoomMorph();
        const shapeLabel = morph < 0.5 ? "聚合" : "漫游";
        statusLine.textContent = `${shapeLabel} ${Math.round(morph * 100)}%`;
      }

      function setState(nextState) {
        if (currentState === nextState) {
          updateStatus();
          return;
        }
        currentState = nextState;
        if (nextState !== APP_STATE.FOCUS) {
          focusOverlay.classList.remove("show");
          focusKind = FOCUS_KIND.NONE;
        }
        updateStatus();
      }

      function applyFocusView() {
        const renderFocusContent = () => {
          if (focusKind === FOCUS_KIND.PHOTO) {
            focusPhotoEl.style.display = "block";
            focusTextWrap.style.display = "none";
            const src = photoOverlaySources[focusIndex];
            if (!src) {
              closeFocus();
              return;
            }
            focusPhotoEl.src = src;
          } else {
            focusPhotoEl.style.display = "none";
            focusTextWrap.style.display = "block";
            focusTextEl.textContent = LOVE_MESSAGES[focusIndex % LOVE_MESSAGES.length] || "想把这句话送给你。";
          }
        };

        if (!focusOverlay.classList.contains("show")) {
          renderFocusContent();
          return;
        }

        focusCard.classList.add("switching");
        if (focusSwapTimer) {
          window.clearTimeout(focusSwapTimer);
        }
        focusSwapTimer = window.setTimeout(() => {
          renderFocusContent();
          requestAnimationFrame(() => focusCard.classList.remove("switching"));
          focusSwapTimer = 0;
        }, 120);
      }

      function openFocus(kind, index) {
        focusKind = kind;

        if (kind === FOCUS_KIND.PHOTO) {
          const visiblePhotoIndexes = [];
          for (let i = 0; i < photoCards.length; i += 1) {
            if (photoCards[i].group.visible) visiblePhotoIndexes.push(i);
          }
          if (visiblePhotoIndexes.length === 0) {
            return;
          }
          if (visiblePhotoIndexes.includes(index)) {
            focusIndex = index;
          } else {
            focusIndex = visiblePhotoIndexes[0];
          }
        } else {
          focusIndex = (index + LOVE_MESSAGES.length) % LOVE_MESSAGES.length;
        }

        applyFocusView();
        focusOverlay.classList.add("show");
        currentState = APP_STATE.FOCUS;
        updateStatus();
      }

      function closeFocus() {
        if (focusSwapTimer) {
          window.clearTimeout(focusSwapTimer);
          focusSwapTimer = 0;
        }
        focusCard.classList.remove("switching");
        focusOverlay.classList.remove("show");
        currentState = APP_STATE.MAIN;
        focusKind = FOCUS_KIND.NONE;
        updateStatus();
      }

      function stepFocus(delta) {
        const visiblePhotoIndexes = [];
        for (let i = 0; i < photoCards.length; i += 1) {
          if (photoCards[i].group.visible) visiblePhotoIndexes.push(i);
        }
        const canPhoto = visiblePhotoIndexes.length > 0;
        const canText = LOVE_MESSAGES.length > 0;
        if (!canPhoto && !canText) return;

        const prevKind = focusKind;
        const prevIndex = focusIndex;

        if (canPhoto && canText) {
          focusKind = Math.random() < 0.5 ? FOCUS_KIND.PHOTO : FOCUS_KIND.TEXT;
        } else {
          focusKind = canPhoto ? FOCUS_KIND.PHOTO : FOCUS_KIND.TEXT;
        }

        if (focusKind === FOCUS_KIND.PHOTO) {
          const len = visiblePhotoIndexes.length;
          let nextPick = Math.floor(Math.random() * len);
          if (len > 1 && prevKind === FOCUS_KIND.PHOTO) {
            const prevVisibleIdx = visiblePhotoIndexes.indexOf(prevIndex);
            if (prevVisibleIdx >= 0 && nextPick === prevVisibleIdx) {
              nextPick = (prevVisibleIdx + (delta >= 0 ? 1 : len - 1)) % len;
            }
          }
          focusIndex = visiblePhotoIndexes[nextPick];
        } else {
          const len = LOVE_MESSAGES.length;
          let nextIndex = Math.floor(Math.random() * len);
          if (len > 1 && prevKind === FOCUS_KIND.TEXT && nextIndex === prevIndex) {
            nextIndex = (prevIndex + (delta >= 0 ? 1 : len - 1)) % len;
          }
          focusIndex = nextIndex;
        }
        applyFocusView();
        updateStatus();
      }

      focusCard.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (currentState === APP_STATE.FOCUS) {
          stepFocus(1);
        }
      });
      focusOverlay.addEventListener("click", (ev) => {
        if (ev.target === focusOverlay) closeFocus();
      });

      window.addEventListener("keydown", (ev) => {
        if (ev.key === "1") cameraRig.targetRadius = MORPH_RANGE.minRadius + 0.15;
        if (ev.key === "2") cameraRig.targetRadius = MORPH_RANGE.maxRadius - 0.15;
        if (ev.key === "Escape" && currentState === APP_STATE.FOCUS) closeFocus();
        if (ev.key === "ArrowLeft" && currentState === APP_STATE.FOCUS) stepFocus(-1);
        if (ev.key === "ArrowRight" && currentState === APP_STATE.FOCUS) stepFocus(1);
      });

      /* ---------------------------
       * 拖拽与缩放控制（鼠标 + 触摸）
       * --------------------------- */
      const controls = {
        pointers: new Map(),
        dragMoved: 0,
        dragFlash: 0,
        clickThreshold: 8,
        pinchDistance: 0,
      };

      function getPointerDistance() {
        const vals = [...controls.pointers.values()];
        if (vals.length < 2) return 0;
        const dx = vals[0].x - vals[1].x;
        const dy = vals[0].y - vals[1].y;
        return Math.hypot(dx, dy);
      }

      function toNDC(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      }

      function pickObject(clientX, clientY) {
        toNDC(clientX, clientY);
        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects([...photoPickMeshes, ...textPickMeshes], false);
        if (hits.length === 0) return;
        const hit = hits[0].object;
        const type = hit.userData.pickType;
        const index = hit.userData.pickIndex || 0;

        if (type === FOCUS_KIND.PHOTO) {
          openFocus(FOCUS_KIND.PHOTO, index);
        } else if (type === FOCUS_KIND.TEXT) {
          openFocus(FOCUS_KIND.TEXT, index);
        }
      }

      canvas.addEventListener("pointerdown", (ev) => {
        canvas.setPointerCapture(ev.pointerId);
        controls.pointers.set(ev.pointerId, {
          x: ev.clientX,
          y: ev.clientY,
          startX: ev.clientX,
          startY: ev.clientY,
        });
        if (controls.pointers.size === 2) {
          controls.pinchDistance = getPointerDistance();
        }
      });

      canvas.addEventListener("pointermove", (ev) => {
        if (!controls.pointers.has(ev.pointerId)) return;
        const p = controls.pointers.get(ev.pointerId);
        const dx = ev.clientX - p.x;
        const dy = ev.clientY - p.y;
        const dragDistance = Math.hypot(dx, dy);
        p.x = ev.clientX;
        p.y = ev.clientY;
        controls.pointers.set(ev.pointerId, p);

        controls.dragMoved += dragDistance;
        if (controls.pointers.size === 1 && dragDistance > 0.08) {
          emitDragGlitterBurst(dragDistance);
          controls.dragFlash = clamp(controls.dragFlash + 0.07 + dragDistance * 0.0068, 0, 2.2);
        }

        if (controls.pointers.size === 1) {
          cameraRig.targetYaw -= dx * 0.006;
          cameraRig.targetPitch += dy * 0.004;
        } else if (controls.pointers.size >= 2) {
          const nextDist = getPointerDistance();
          if (controls.pinchDistance > 0 && nextDist > 0) {
            const delta = (controls.pinchDistance - nextDist) * 0.012;
            cameraRig.targetRadius = clamp(
              cameraRig.targetRadius + delta,
              MORPH_RANGE.minRadius,
              MORPH_RANGE.maxRadius
            );
          }
          controls.pinchDistance = nextDist;
        }
      });

      canvas.addEventListener("pointerup", (ev) => {
        const p = controls.pointers.get(ev.pointerId);
        if (p && controls.dragMoved < controls.clickThreshold && currentState !== APP_STATE.FOCUS) {
          pickObject(ev.clientX, ev.clientY);
        }
        controls.pointers.delete(ev.pointerId);
        if (controls.pointers.size < 2) controls.pinchDistance = 0;
        controls.dragMoved = 0;
      });

      canvas.addEventListener("pointercancel", (ev) => {
        controls.pointers.delete(ev.pointerId);
        if (controls.pointers.size < 2) controls.pinchDistance = 0;
        controls.dragMoved = 0;
      });

      canvas.addEventListener(
        "wheel",
        (ev) => {
          cameraRig.targetRadius = clamp(
            cameraRig.targetRadius + ev.deltaY * 0.004,
            MORPH_RANGE.minRadius,
            MORPH_RANGE.maxRadius
          );
        },
        { passive: true }
      );

      // iOS Safari: block browser-level pinch zoom so two-finger gesture only controls scene zoom.
      const blockBrowserGesture = (ev) => {
        ev.preventDefault();
      };
      document.addEventListener("gesturestart", blockBrowserGesture, { passive: false });
      document.addEventListener("gesturechange", blockBrowserGesture, { passive: false });
      document.addEventListener("gestureend", blockBrowserGesture, { passive: false });

      /* ---------------------------
       * 动画更新
       * --------------------------- */
      function updateCamera(dt) {
        const t = clock.getElapsedTime();
        const morph = getZoomMorph();
        const autoYaw = lerp(0.0026, 0.0011, morph);
        cameraRig.targetYaw += autoYaw + dt * 0.014;
        const floatPitch = 0.16 + Math.sin(t * lerp(0.52, 0.32, morph)) * lerp(0.055, 0.025, morph);
        cameraRig.targetPitch = lerp(cameraRig.targetPitch, floatPitch, 0.02);

        cameraRig.targetPitch = clamp(cameraRig.targetPitch, -0.55, 0.72);
        cameraRig.yaw = lerp(cameraRig.yaw, cameraRig.targetYaw, 0.08);
        cameraRig.pitch = lerp(cameraRig.pitch, cameraRig.targetPitch, 0.08);
        cameraRig.radius = lerp(cameraRig.radius, cameraRig.targetRadius, 0.08);

        const cp = Math.cos(cameraRig.pitch);
        camera.position.set(
          cameraRig.radius * Math.sin(cameraRig.yaw) * cp,
          cameraRig.radius * Math.sin(cameraRig.pitch) * 0.95,
          cameraRig.radius * Math.cos(cameraRig.yaw) * cp
        );
        camera.lookAt(0, 0.5, 0);
      }

      function updateHeartParticles(dt) {
        const t = clock.getElapsedTime();
        const morph = getZoomMorph();
        const dragGlowBoost = 1 + controls.dragFlash * 1.2;
        const breath = 1 + Math.sin(t * 2) * (0.02 + (1 - morph) * 0.03);
        const heartCompact = lerp(0.76, 1, morph);
        const sparkCompact = lerp(0.8, 1, morph);

        heartMat.emissiveIntensity = (lerp(0.72, 0.42, morph) + Math.sin(t * 1.8) * 0.03) * dragGlowBoost;
        sparkMat.emissiveIntensity = lerp(1.92, 1.15, morph) + controls.dragFlash * 1.25;
        sparkMat.opacity = clamp(lerp(0.99, 0.78, morph) + controls.dragFlash * 0.18, 0.4, 1);

        for (let i = 0; i < hearts.length; i += 1) {
          const item = hearts[i];

          const heartTarget = tmpVec.copy(item.heartPos).multiplyScalar(breath * heartCompact);
          heartTarget.y += Math.sin(t * 2.4 + item.phase) * 0.08;

          const wanderTarget = tmpVecB.copy(item.wanderPos);
          wanderTarget.x += Math.cos(t * 0.85 + item.phase * 1.1) * 0.38;
          wanderTarget.y += Math.sin(t * 1.04 + item.phase) * 0.34;
          wanderTarget.z += Math.sin(t * 0.72 + item.phase * 1.3) * 0.28;

          tmpVec.lerpVectors(heartTarget, wanderTarget, morph);
          item.pos.lerp(tmpVec, lerp(0.09, 0.05, morph));
          item.rot.x += dt * lerp(0.32, 0.18, morph);
          item.rot.y += dt * lerp(0.42, 0.24, morph);
          item.rot.z += dt * lerp(0.2, 0.14, morph);

          tmpObject.position.copy(item.pos);
          tmpObject.rotation.copy(item.rot);
          const twinkle = 0.82 + Math.sin(t * (1.5 + morph) + item.phase) * 0.14;
          tmpObject.scale.setScalar(item.scale * twinkle * lerp(1.06, 0.9, morph));
          tmpObject.updateMatrix();
          heartMesh.setMatrixAt(i, tmpObject.matrix);
        }
        heartMesh.instanceMatrix.needsUpdate = true;

        for (let i = 0; i < sparks.length; i += 1) {
          const s = sparks[i];

          const heartTarget = tmpVec.copy(s.heartPos).multiplyScalar(breath * 1.1 * sparkCompact);
          heartTarget.y += Math.sin(t * 2.3 + s.phase) * 0.16;

          const wanderTarget = tmpVecB.copy(s.wanderPos);
          wanderTarget.x += Math.sin(t * 0.92 + s.phase) * 0.34;
          wanderTarget.y += Math.cos(t * 1.16 + s.phase) * 0.31;
          wanderTarget.z += Math.cos(t * 0.76 + s.phase * 1.8) * 0.26;

          tmpVec.lerpVectors(heartTarget, wanderTarget, morph);
          s.pos.lerp(tmpVec, lerp(0.1, 0.058, morph));

          tmpObject.position.copy(s.pos);
          tmpObject.rotation.set(0, 0, 0);
          tmpObject.scale.setScalar(s.scale * 1.24 * (0.72 + Math.sin(t * 3.4 + s.phase) * 0.2));
          tmpObject.updateMatrix();
          sparkMesh.setMatrixAt(i, tmpObject.matrix);
        }
        sparkMesh.instanceMatrix.needsUpdate = true;
      }

      function updatePhotoCards() {
        const t = clock.getElapsedTime();
        const morph = getZoomMorph();
        const photoCompact = lerp(0.82, 1, morph);

        for (let i = 0; i < photoCards.length; i += 1) {
          const card = photoCards[i];
          const activePhotoFocus = currentState === APP_STATE.FOCUS && focusKind === FOCUS_KIND.PHOTO && focusIndex === i;

          const heartTarget = tmpVec.copy(card.heartPos).multiplyScalar(photoCompact);
          heartTarget.y += Math.sin(t * 1.45 + card.phase) * 0.1;
          const wanderTarget = tmpVecB.copy(card.wanderPos);
          wanderTarget.x += Math.sin(t * 0.88 + card.phase) * 0.24;
          wanderTarget.y += Math.cos(t * 1.02 + card.phase) * 0.26;
          wanderTarget.z += Math.sin(t * 0.76 + card.phase * 1.4) * 0.2;

          tmpVec.lerpVectors(heartTarget, wanderTarget, morph);
          card.pos.lerp(tmpVec, lerp(0.08, 0.06, morph));
          card.group.position.copy(card.pos);
          card.group.lookAt(camera.position);

          const sizeByMorph = lerp(0.34, 2.2, morph);
          const baseScale = card.scale * sizeByMorph * (0.96 + Math.sin(t * 1.4 + card.phase) * 0.04);
          const scale = activePhotoFocus ? baseScale * 1.14 : baseScale;
          card.group.scale.lerp(tmpVecB.set(scale, scale, scale), 0.1);

          let targetOpacity = lerp(0.95, 0.74, morph);
          if (currentState === APP_STATE.FOCUS) {
            if (focusKind === FOCUS_KIND.PHOTO) {
              targetOpacity = activePhotoFocus ? 1 : 0.16;
            } else {
              targetOpacity = 0.14;
            }
          }
          card.photoMat.opacity = lerp(card.photoMat.opacity, targetOpacity, 0.12);
          card.frame.material.opacity = lerp(card.frame.material.opacity, targetOpacity * 0.96, 0.12);
          card.halo.material.opacity = lerp(card.halo.material.opacity, targetOpacity * 0.18, 0.12);
        }
      }

      function updateTextCards() {
        const t = clock.getElapsedTime();
        const morph = getZoomMorph();
        const textCompact = lerp(0.8, 1, morph);

        for (let i = 0; i < textCards.length; i += 1) {
          const chip = textCards[i];
          const activeTextFocus =
            currentState === APP_STATE.FOCUS &&
            focusKind === FOCUS_KIND.TEXT &&
            focusIndex === chip.textIndex;

          const heartTarget = tmpVec.copy(chip.heartPos).multiplyScalar(textCompact);
          heartTarget.y += Math.cos(t * 1.3 + chip.phase) * 0.08;
          const wanderTarget = tmpVecB.copy(chip.wanderPos);
          wanderTarget.x += Math.cos(t * 0.82 + chip.phase) * 0.2;
          wanderTarget.y += Math.sin(t * 1.06 + chip.phase) * 0.2;
          wanderTarget.z += Math.cos(t * 0.74 + chip.phase * 1.5) * 0.18;

          tmpVec.lerpVectors(heartTarget, wanderTarget, morph);
          chip.pos.lerp(tmpVec, lerp(0.08, 0.058, morph));
          chip.group.position.copy(chip.pos);
          chip.group.lookAt(camera.position);

          const textSizeByMorph = lerp(1.0, 4.0, morph);
          const baseScale = chip.scale * textSizeByMorph * (0.96 + Math.sin(t * 1.4 + chip.phase) * 0.04);
          const scale = activeTextFocus ? baseScale * 1.15 : baseScale;
          chip.group.scale.lerp(tmpVecB.set(scale, scale, scale), 0.1);

          let targetOpacity = lerp(0.92, 0.7, morph);
          if (currentState === APP_STATE.FOCUS) {
            if (focusKind === FOCUS_KIND.TEXT) {
              targetOpacity = activeTextFocus ? 1 : 0.16;
            } else {
              targetOpacity = 0.12;
            }
          }

          chip.mat.opacity = lerp(chip.mat.opacity, targetOpacity, 0.12);
          chip.shell.material.opacity = lerp(chip.shell.material.opacity, targetOpacity * 0.8, 0.12);
        }
      }

      function updateDustParticles() {
        const t = clock.getElapsedTime();
        const morph = getZoomMorph();
        const dustCompact = lerp(0.8, 1, morph);
        for (let i = 0; i < dustParticles.length; i += 1) {
          const p = dustParticles[i];
          const heartTarget = tmpVec.copy(p.heartPos).multiplyScalar(dustCompact);
          heartTarget.y += Math.sin(t * 1.95 + p.phase) * 0.09;
          const wanderTarget = tmpVecB.copy(p.wanderPos);
          wanderTarget.x += Math.sin(t * 0.85 + p.phase) * 0.5;
          wanderTarget.y += Math.cos(t * 1.15 + p.phase) * 0.4;
          wanderTarget.z += Math.cos(t * 0.73 + p.phase * 1.3) * 0.38;

          p.pos.lerpVectors(heartTarget, wanderTarget, morph);
          dustPositions[i * 3] = p.pos.x;
          dustPositions[i * 3 + 1] = p.pos.y;
          dustPositions[i * 3 + 2] = p.pos.z;
        }
        dustGeometry.attributes.position.needsUpdate = true;
      }

      function updateGlintParticles() {
        const t = clock.getElapsedTime();
        const morph = getZoomMorph();
        const glintCompact = lerp(0.66, 1, morph);
        for (let i = 0; i < glintParticles.length; i += 1) {
          const p = glintParticles[i];
          const heartTarget = tmpVec.copy(p.heartPos).multiplyScalar(glintCompact);
          heartTarget.y += Math.sin(t * 1.45 + p.phase) * 0.07;
          const wanderTarget = tmpVecB.copy(p.wanderPos);
          wanderTarget.x += Math.cos(t * 0.62 + p.phase) * 0.36;
          wanderTarget.y += Math.sin(t * 0.9 + p.phase) * 0.34;
          wanderTarget.z += Math.cos(t * 0.58 + p.phase * 1.4) * 0.32;

          p.pos.lerpVectors(heartTarget, wanderTarget, morph);
          glintPositions[i * 3] = p.pos.x;
          glintPositions[i * 3 + 1] = p.pos.y;
          glintPositions[i * 3 + 2] = p.pos.z;
        }
        glintGeometry.attributes.position.needsUpdate = true;
      }

      function updateBackground(dt) {
        const t = clock.getElapsedTime();
        dustMaterial.uniforms.uTime.value = t;
        dustMaterial.uniforms.uOpacity.value = lerp(0.92, 0.62, getZoomMorph());
        glintMaterial.uniforms.uTime.value = t;
        glintMaterial.uniforms.uOpacity.value = lerp(0.72, 0.44, getZoomMorph());
      }

      function updateDragGlitter(dt) {
        const t = clock.getElapsedTime();
        dragGlitterMaterial.uniforms.uTime.value = t;
        controls.dragFlash = Math.max(0, controls.dragFlash - dt * 1.35);
        if (!ambientGlitterSeeded) {
          emitAmbientDragGlitter(isMobile ? 90 : 150);
          ambientGlitterSeeded = true;
        }
        ambientGlitterCarry += dt * AMBIENT_GLITTER_RATE;
        const ambientEmitCount = Math.floor(ambientGlitterCarry);
        if (ambientEmitCount > 0) {
          emitAmbientDragGlitter(ambientEmitCount);
          ambientGlitterCarry -= ambientEmitCount;
        }

        for (let i = 0; i < dragGlitterParticles.length; i += 1) {
          const particle = dragGlitterParticles[i];
          if (particle.life <= 0) {
            dragGlitterAlphas[i] = 0;
            continue;
          }

          particle.life -= dt;
          if (particle.life <= 0) {
            dragGlitterAlphas[i] = 0;
            continue;
          }

          particle.pos.addScaledVector(particle.vel, dt);
          particle.vel.multiplyScalar(Math.exp(-1.6 * dt));
          particle.vel.y += dt * 0.25;

          const lifeT = clamp(particle.life / particle.maxLife, 0, 1);
          const twinkle = 0.8 + 0.32 * Math.sin(t * 14 + particle.twinkle);
          dragGlitterPositions[i * 3] = particle.pos.x;
          dragGlitterPositions[i * 3 + 1] = particle.pos.y;
          dragGlitterPositions[i * 3 + 2] = particle.pos.z;
          dragGlitterSizes[i] = particle.size * (0.64 + (1 - lifeT) * 0.48 + twinkle * 0.18);
          dragGlitterAlphas[i] = (lifeT * lifeT * twinkle) * 1.15 * particle.intensity;
          const colorPulse = 0.88 + 0.12 * Math.sin(t * 9.6 + particle.twinkle * 1.3);
          dragGlitterColors[i * 3] = particle.r * colorPulse;
          dragGlitterColors[i * 3 + 1] = particle.g * colorPulse;
          dragGlitterColors[i * 3 + 2] = particle.b * colorPulse;
        }

        dragGlitterGeometry.attributes.position.needsUpdate = true;
        dragGlitterGeometry.attributes.size.needsUpdate = true;
        dragGlitterGeometry.attributes.alpha.needsUpdate = true;
        dragGlitterGeometry.attributes.color.needsUpdate = true;
      }

      function animate() {
        const dt = Math.min(clock.getDelta(), 1 / 20);

        updateCamera(dt);
        updateHeartParticles(dt);
        updatePhotoCards();
        updateTextCards();
        updateDustParticles();
        updateGlintParticles();
        updateDragGlitter(dt);
        updateBackground(dt);
        if (currentState !== APP_STATE.FOCUS) {
          updateStatus();
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      window.addEventListener("resize", () => {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        dustMaterial.uniforms.uPixelRatio.value = pixelRatio;
        glintMaterial.uniforms.uPixelRatio.value = pixelRatio;
        dragGlitterMaterial.uniforms.uPixelRatio.value = pixelRatio;
      });

      setState(APP_STATE.MAIN);
      animate();
    </script>
  </body>
</html>
