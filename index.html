<div class="personal-home">

  <div class="roll-in" data-delay="0.08s">
    <h3>Hello, </h3>
    <p></p>
  </div>

  <div class="roll-in" data-delay="0.16s">
    <ul>
      <li>Valentine mini app: <a href="/valentine/">/valentine/</a></li>
      <li>Family gallery: <a href="/family-gallery/">/family-gallery/</a></li>
    </ul>
  </div>
</div>

<script>
  (() => {
    const items = document.querySelectorAll('.roll-in');
    if (!items.length) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced || !('IntersectionObserver' in window)) {
      items.forEach((el) => el.classList.add('is-visible'));
      return;
    }
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        const delay = entry.target.getAttribute('data-delay');
        if (delay) entry.target.style.transitionDelay = delay;
        entry.target.classList.add('is-visible');
        obs.unobserve(entry.target);
      });
    }, { threshold: 0.18 });
    items.forEach((el) => observer.observe(el));
  })();
</script>
